# cargo-deny configuration. See DEV-REQUIREMENTS §5.1 and
# STANDARDS.md §5.
#
# Complements cargo-audit (see .cargo/audit.toml) with three checks
# audit does not cover:
#
#   1. licenses  — every dep's license is in the allow-list below
#   2. bans      — no wildcard version specs, warn on duplicate
#                  crate versions
#   3. sources   — every crate comes from crates.io (no unvetted
#                  git URLs)
#
# Enforced in CI via .github/workflows/security.yml.

[graph]
all-features = false
no-default-features = false

# -----------------------------------------------------------------
# Advisories — cargo-deny has its OWN advisory reader; it does not
# consult .cargo/audit.toml. Any exception documented for cargo-audit
# must be mirrored here (same IDs, same rationale, same review date)
# or cargo-deny will fail the check while cargo-audit passes.
# -----------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0253 (lru 0.16.4 "unsound") was ignored while
# aws-sdk-s3 was still on `lru ^0.16`. aws-sdk-s3 1.146.1 now
# pulls `lru 0.18.4` transitively — verified via
# `cargo tree -i lru` on 2026-09-18. The advisory no longer
# applies to this build; the ignore was dropped in the same
# commit that removed it from `.cargo/audit.toml`.
#
# RUSTSEC-2024-0449 (unsafe-libyaml 0.2.11 unmaintained).
# Informational advisory issued 2026-10-12 — the upstream
# repo was archived 2024-03-25. Pulled in transitively via
# `serde_yaml_ng -> unsafe-libyaml`. The entire serde_yaml /
# serde_yaml_ng / serde_yaml_bw fork chain still relies on it
# (serde_yaml_bw forks it as `unsafe-libyaml-norway`;
# `serde_yml` is deprecated); no patched version exists.
# FileFerry uses the crate at boot only, to parse the
# operator-supplied `fileferry.yaml` config — not for runtime
# processing of untrusted input. Risk surface: one
# trusted-source parse per process. Migration to a pure-Rust
# parser (saphyr / noyalib) is tracked for a future release.
# Mirror of the entry in `.cargo/audit.toml`.
# Review by: 2027-04-15
ignore = ["RUSTSEC-2024-0449"]

# -----------------------------------------------------------------
# Licenses — allow-list. Anything not listed here fails the build.
# Apache-2.0-compatible only. No GPL / AGPL / SSPL.
# -----------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",             # weak copyleft, safe to link
    "CC0-1.0",
    "0BSD",
    "OpenSSL",             # required for aws-lc-sys / ring vendor bits
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# -----------------------------------------------------------------
# Bans
# -----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# -----------------------------------------------------------------
# Sources — crates.io only.
# -----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
