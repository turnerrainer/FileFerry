# cargo-deny configuration. See DEV-REQUIREMENTS §5.1 and
# STANDARDS.md §5.
#
# Complements cargo-audit (see .cargo/audit.toml) with three checks
# audit does not cover:
#
#   1. licenses  — every dep's license is in the allow-list below
#   2. bans      — no wildcard version specs, warn on duplicate
#                  crate versions
#   3. sources   — every crate comes from crates.io (no unvetted
#                  git URLs)
#
# Enforced in CI via .github/workflows/security.yml.

[graph]
all-features = false
no-default-features = false

# -----------------------------------------------------------------
# Advisories — cargo-deny has its OWN advisory reader; it does not
# consult .cargo/audit.toml. Any exception documented for cargo-audit
# must be mirrored here (same IDs, same rationale, same review date)
# or cargo-deny will fail the check while cargo-audit passes.
# -----------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0253 — `lru` 0.16.4, "unsound" (informational),
    # potential use-after-free in `LruCache::pop()` if a stored key's
    # `Drop` panics while unwinding is enabled. Fixed in lru 0.18.2.
    #
    # Reached transitively via aws-sdk-s3 → lru "^0.16" (see
    # `cargo tree -i lru`). aws-sdk-s3 has not yet moved to lru 0.18,
    # and the semver bump prevents a `[patch.crates-io]` override.
    # FileFerry never touches this LruCache directly and stores no
    # panic-on-Drop key types in it, so the unsound path is not
    # reachable in practice.
    # Review: 2026-08-18. Re-check when aws-sdk-s3 bumps its `lru`
    # constraint or when a semver-compatible 0.16.x fix ships.
    "RUSTSEC-2026-0253",
]

# -----------------------------------------------------------------
# Licenses — allow-list. Anything not listed here fails the build.
# Apache-2.0-compatible only. No GPL / AGPL / SSPL.
# -----------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",             # weak copyleft, safe to link
    "CC0-1.0",
    "0BSD",
    "OpenSSL",             # required for aws-lc-sys / ring vendor bits
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# -----------------------------------------------------------------
# Bans
# -----------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# -----------------------------------------------------------------
# Sources — crates.io only.
# -----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
