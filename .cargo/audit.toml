# cargo-audit configuration.
#
# Advisory IDs listed under `ignore` are downgraded to soft warnings
# so `cargo audit --deny warnings` still passes. Every entry MUST
# carry a rationale and a review date; unreviewed entries are a
# code smell.
#
# NOTE: any exception here MUST be mirrored in `deny.toml`'s
# `[advisories].ignore` — cargo-audit and cargo-deny do NOT share
# this file. See DEV-REQUIREMENTS §5.1.

# RUSTSEC-2026-0253 (lru 0.16.4 "unsound") was ignored while
# aws-sdk-s3 was still on `lru ^0.16`. aws-sdk-s3 1.146.1 now
# pulls `lru 0.18.4` transitively — verified via
# `cargo tree -i lru` on 2026-09-18. The advisory no longer
# applies to this build; the ignore was dropped in the same
# commit that removed it from `deny.toml`.
[advisories]
ignore = []
