# Production-hardened compose file for FileFerry.
# See STANDARDS.md §7 for the security posture rationale.
services:
  fileferry:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileferry:0.2.1-alpha
    container_name: fileferry
    ports:
      - "8080:8080"
    # The image ships fileferry.yaml + an empty /app/data baked in
    # as the demo. Override any of those with bind mounts:
    #
    # volumes:
    #   - ./fileferry.yaml:/app/fileferry.yaml:ro   # your own config
    #   - ./data:/app/data:rw                       # persistent local file store
    environment:
      - RUST_LOG=info
      # S3 credentials come from env vars named by fileferry.yaml.
      # Uncomment and populate on real deployments — never inline the
      # secret values here.
      # - FILEFERRY_S3_ACCESS_KEY_ID=<from-your-secret-manager>
      # - FILEFERRY_S3_SECRET_ACCESS_KEY=<from-your-secret-manager>
    restart: unless-stopped
    # FN4 (h2ck.me v1 runtime): make the container rootfs immutable
    # so a shell-level RCE cannot overwrite `/app/fileferry` or drop a
    # shared library. The FS backend still needs a writable data path;
    # that's mounted separately as a named volume below (and a `tmpfs`
    # for `/tmp` was already in place). Set `read_only: false` locally
    # only when developing against the shipped baked-in `/app/data`.
    read_only: true
    tmpfs:
      - /tmp:size=64M
    volumes:
      # FN4: writable data path lives on a named volume so the rootfs
      # can stay read-only. If you'd rather bind-mount a host path,
      # replace this with `- ./data:/app/data:rw`.
      - fileferry_data:/app/data:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # FN4: named volume that hosts the FS-backend data directory. Docker
  # picks the driver (defaults to `local` = a directory under
  # `/var/lib/docker/volumes`) so we don't inherit the surrounding
  # rootfs's read-only flag.
  fileferry_data:
