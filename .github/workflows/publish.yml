name: Publish container image

# Three entry paths, one deploy path. In all three cases the actual
# `publish` job runs inside the `production` GitHub Environment,
# which is configured with required reviewers — no image is pushed
# to GHCR / Docker Hub without an explicit human approval in the
# Actions UI.
#
# 1. **Release-by-merge** (the primary "single-PR release" flow):
#    Merging a `dev → main` PR runs the `tag-from-main` job. It
#    reads the version from `Cargo.toml`, refuses to proceed if
#    the corresponding `v<version>` tag already exists, otherwise
#    tags the merge commit and pushes the tag. The tag push then
#    triggers `publish` on the tag ref, which waits for the
#    `production` environment approval. From the maintainer's
#    perspective: merge the release PR → approve the deploy →
#    Release entry appears at
#    <https://github.com/turnerrainer/fileferry/releases>.
#
# 2. **Tag-push** (the legacy / manual path):
#    `git push origin v0.2.0-alpha` skips `tag-from-main` and
#    triggers `publish` directly. Kept so pre-existing tags and
#    hotfix workflows still work.
#
# 3. **workflow_dispatch** (the escape hatch):
#    Lets a maintainer re-run `publish` against an existing tag
#    from the Actions UI without cutting a new tag. Useful when
#    the workflow itself has a config bug. Still gated by the
#    `production` environment reviewer.
#
# Alpha versioning: PATCH-as-alpha-counter with a bare `-alpha`
# suffix (0.1.1-alpha, 0.1.2-alpha, 0.1.3-alpha, 0.2.0-alpha, ...).
# See CHANGELOG.md for the mapping from the old `-alpha.N` form.
#
# Tag shapes:
#   v0.1.0        → stable release
#   v0.1.3-alpha  → pre-release (alpha / beta / rc / preview /
#                   any SemVer pre-release identifier)
# The `Compose image tags` step below reads which shape was pushed
# and chooses whether to move :latest and :major.minor accordingly.
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0-alpha). Must already exist on the repo."
        required: true
        type: string

# Concurrency keys on `github.ref` — so a `push:main` and a
# subsequent `push:tag/v0.2.0-alpha` for the same release land in
# DIFFERENT groups and can proceed serially (tag-from-main first,
# then publish on the tag push). Two runs of the same tag / branch
# are serialised.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `contents: write` is required so the final step can create the
  # GitHub Release entry (populated from the matching CHANGELOG.md
  # section). No other step writes to the repo.
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Release-by-merge entry point. Fires only on `push:main`.
  # Reads the version from `Cargo.toml`, refuses to proceed if the
  # corresponding `v<version>` tag already exists (release already
  # shipped for this version — nothing to do), otherwise tags the
  # merge commit and pushes the tag. The tag push then triggers the
  # `publish` job below via the `push: tags:` entry.
  #
  # No `environment:` on this job — creating a tag is not a deploy.
  # The deploy gate lives on `publish`. That way a maintainer can
  # merge a release PR without immediately being asked to approve
  # a deploy; the approval happens as a separate step when the tag
  # push triggers `publish`.
  tag-from-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Explicit token so `git push` uses GITHUB_TOKEN with the
          # workflow-level `contents: write` permission.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Cargo.toml version → tag_ref
        id: version
        run: |
          set -euo pipefail
          # `cargo pkgid` would work but pulls in the full resolver;
          # for a single-crate repo the direct grep is faster and
          # zero-dependency.
          VERSION="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          TAG_REF="v${VERSION}"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "tag_ref=${TAG_REF}"  >> "$GITHUB_OUTPUT"
          echo "Derived tag: ${TAG_REF} (from Cargo.toml version=${VERSION})"

      - name: Skip if release tag already exists
        id: exists
        env:
          TAG_REF: ${{ steps.version.outputs.tag_ref }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${TAG_REF}" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/${TAG_REF}" >/dev/null 2>&1
          then
            echo "::notice::${TAG_REF} already exists — release already shipped for this version; nothing to do."
            echo "already_shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_shipped=false" >> "$GITHUB_OUTPUT"
          fi

      # Only create + push the tag if it doesn't already exist. The
      # push triggers a second workflow run (this same file) via the
      # `push: tags:` entry above, which runs the `publish` job.
      - name: Create and push release tag
        if: steps.exists.outputs.already_shipped == 'false'
        env:
          TAG_REF: ${{ steps.version.outputs.tag_ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG_REF}" -m "FileFerry ${TAG_REF}

          Auto-tagged by publish.yml on push to main.
          See CHANGELOG.md [${VERSION}] for release notes.
          "
          git push origin "${TAG_REF}"
          echo "::notice::Pushed ${TAG_REF} — publish workflow will run on the tag ref and wait for production-env approval."

  publish:
    # Skip on `push:main` — that's `tag-from-main`'s job. Run on
    # tag pushes (the tag `tag-from-main` just created, or an
    # externally-pushed tag) and on manual dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Required reviewers on the `production` environment enforce the
    # release policy: no deploy without a human approval in the
    # Actions UI. Configure in repo settings → Environments →
    # production → "Required reviewers". Without this environment
    # configured, the job pauses on "Waiting for review" — that's
    # the intended behaviour, not a bug.
    environment:
      name: production
      url: https://github.com/turnerrainer/fileferry/pkgs/container/fileferry
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Derive the tag list. Two paths:
      #   * Stable release (`v0.1.0`):
      #       → push :0.1.0, :0.1, :latest
      #   * Pre-release  (`v0.1.3-alpha`, `v0.2.0-beta.1`, ...):
      #       → push :0.1.3-alpha AND :<suffix-type> (e.g. :alpha,
      #         :beta, :rc). Never move :latest or :0.1 from a pre-
      #         release — those are the implicit-trust tags.
      - name: Compose image tags
        id: meta
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            SUFFIX="${VERSION#*-}"
            SUFFIX_TYPE="${SUFFIX%%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$SUFFIX_TYPE
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$SUFFIX_TYPE
          END
          )
          else
            PRERELEASE=false
            MAJOR_MINOR="${VERSION%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$MAJOR_MINOR
          ghcr.io/turnerrainer/fileferry:latest
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$MAJOR_MINOR
          docker.io/turnerrainer/fileferry:latest
          END
          )
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"  >> "$GITHUB_OUTPUT"
          {
            echo "tags<<END_OF_TAGS"
            echo "$TAG_LINES"
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tags:"
          echo "$TAG_LINES"

      # SOURCE_DATE_EPOCH pins layer timestamps to the tag commit's
      # time. Buildx honours it with `rewrite-timestamp=true` below.
      # Bit-for-bit Rust binary reproducibility is a separate rabbit
      # hole and is NOT enforced here.
      - name: Compute SOURCE_DATE_EPOCH from commit time
        id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo secrets needed: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
      # (Read/Write/Delete scope). See DEV-REQUIREMENTS §9.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # `ignore-error=true` — cache-export failures on re-runs
          # / workflow_dispatch should not fail the publish.
          cache-to: type=gha,mode=max,ignore-error=true

      # Trivy checks OS layer + language deps. `--exit-code 1` on
      # HIGH/CRITICAL findings blocks signing. `ignore-unfixed:
      # true` because we can't patch upstream Debian CVEs.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Smoke test each per-arch image. Docker keys locally-cached
      # images by digest, not (digest, platform), so we docker rmi
      # between iterations and pull explicitly with --platform.
      - name: Smoke test — /health on both arches
        env:
          IMAGE: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke test on ${platform}"
            docker image rm -f "${IMAGE}" >/dev/null 2>&1 || true
            docker pull --quiet --platform "${platform}" "${IMAGE}"
            cid="$(docker run -d --rm --platform "${platform}" \
                   -p 18080:8080 "${IMAGE}")"

            ok=0
            for i in $(seq 1 90); do
              if curl -sf http://localhost:18080/health >/dev/null; then
                echo "${platform}: /health OK after ${i}s"
                ok=1
                break
              fi
              sleep 1
            done

            if [ "${ok}" -ne 1 ]; then
              echo "::error::${platform}: /health did not respond within 90s"
              docker logs "${cid}" || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
              exit 1
            fi

            docker rm -f "${cid}" >/dev/null
            echo "::endgroup::"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via GHA OIDC. Signs both registries so
      # `cosign verify` works wherever a partner pulls from.
      - name: Sign published images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for registry_image in \
              ghcr.io/turnerrainer/fileferry \
              docker.io/turnerrainer/fileferry
          do
            echo "Signing ${registry_image}@${DIGEST}"
            cosign sign --yes "${registry_image}@${DIGEST}"
          done

      # Extract the CHANGELOG.md slice matching the tag we're publishing
      # so the GitHub Release body reads like the release notes and not
      # like a hand-written blob that can drift from CHANGELOG.md. The
      # awk block matches `## [VERSION]` (with or without a date suffix)
      # and stops at the next `## [` heading.
      - name: Extract CHANGELOG slice for this release
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          slice="$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              # Match `## [VERSION]` at the start of the line, tolerant
              # of optional ` - YYYY-MM-DD` suffixes.
              if ($0 ~ "^## \\[" ver "\\]") {
                in_section = 1
                next
              }
            }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$slice" ]; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section — Release body will be empty"
          fi
          {
            echo "body<<END_OF_NOTES"
            printf '%s\n' "$slice"
            echo ""
            echo "---"
            echo ""
            echo "**Container images** (signed via cosign keyless, in-toto + SPDX SBOM attached):"
            echo ""
            echo "- \`ghcr.io/turnerrainer/fileferry:${VERSION}\`"
            echo "- \`docker.io/turnerrainer/fileferry:${VERSION}\`"
            echo ""
            echo "Verify: \`cosign verify ghcr.io/turnerrainer/fileferry:${VERSION} --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Create (or update) the GitHub Release entry for this tag. Runs
      # after signing so a signed image is always visible on the
      # Releases page; if signing failed the workflow aborts before
      # this step so we never publish a Release for an unverified
      # image. `prerelease` is derived from the tag (any tag with a
      # `-<suffix>` is a pre-release per `steps.meta`).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "FileFerry ${{ github.event.inputs.tag || github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: false
