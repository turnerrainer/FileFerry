name: Publish container image

# Three entry paths, one deploy path. The **PR review + merge is
# the approval** — `publish` runs unmanned to completion once
# triggered. No separate Actions-UI approval step. The safety
# gates are (a) required PR review before merge to `dev`, and
# (b) hard workflow-internal gates: Trivy blocks on HIGH/CRITICAL
# findings, per-arch `/health` smoke test must pass, cosign
# signing must succeed, and the final verify step re-fetches the
# GitHub Release to confirm it landed.
#
# `dev` is the repo's default branch and its release branch — this
# workflow watches `dev` directly rather than a separate `main`.
#
# 1. **Release-by-merge** (the primary flow):
#    Merging a `release/*` PR that bumps `Cargo.toml` into `dev`
#    runs `tag-on-version-bump`. It reads `version` from
#    `Cargo.toml`, exits idempotently when the corresponding
#    `v<version>` tag AND a GitHub Release both exist, tags +
#    pushes when the tag is missing, and dispatches `publish`
#    when the Release is missing (fresh bump, orphaned-tag
#    recovery, or rerun). The dispatched `publish` runs the full
#    pipeline unmanned to completion. From the maintainer's
#    perspective: merge → done. Release entry appears at
#    <https://github.com/turnerrainer/fileferry/releases>.
#    Feature PRs into `dev` fire this workflow too but
#    short-circuit because tag + Release both exist.
#
# 2. **Tag-push** (the legacy / manual path):
#    `git push origin v0.2.0-alpha` skips `tag-on-version-bump`
#    and triggers `publish` directly. Kept so pre-existing tags
#    and hotfix workflows still work.
#
# 3. **workflow_dispatch** (the escape hatch):
#    Lets a maintainer re-run `publish` against an existing tag
#    from the Actions UI without cutting a new tag. Useful when
#    the workflow itself has a config bug.
#
# Alpha versioning: PATCH-as-alpha-counter with a bare `-alpha`
# suffix (0.1.1-alpha, 0.1.2-alpha, 0.1.3-alpha, 0.2.0-alpha, ...).
# MINOR bumps mark bigger releases (new config axis, breaking wire
# changes) — see CHANGELOG.md for the version-bump rationale.
#
# Tag shapes:
#   v0.1.0        → stable release
#   v0.1.3-alpha  → pre-release (alpha / beta / rc / preview /
#                   any SemVer pre-release identifier)
# The `Compose image tags` step below reads which shape was pushed
# and chooses whether to move :latest and :major.minor accordingly.
on:
  push:
    branches: [dev]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0-alpha). Must already exist on the repo."
        required: true
        type: string

# Concurrency keys on `github.ref` — a `push:dev` and its follow-up
# `push:tag/v0.2.0-alpha` for the same release land in DIFFERENT
# groups and proceed serially (tag-on-version-bump first, then
# publish on the tag push). Two runs of the same tag / branch are
# serialised.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `contents: write` is required so `tag-on-version-bump` can push
  # the release tag and so the `Create GitHub Release` step can
  # write to the Releases surface.
  contents: write
  # `actions: write` lets `tag-on-version-bump` dispatch this same
  # workflow on the newly-pushed tag via `gh workflow run`.
  # Necessary because GITHUB_TOKEN-authored pushes do NOT trigger
  # downstream workflow runs (GHA's recursion guard). Without this
  # dispatch, the tag lands but `publish` never fires.
  actions: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Release-by-merge entry point. Fires on every push to `dev` and
  # short-circuits idempotently when the `v<Cargo.toml version>`
  # tag AND a matching GitHub Release both exist — so feature-PR
  # merges cost only a quick `git ls-remote` + `gh release view`,
  # and only a version bump (or orphaned-tag recovery) results in
  # a fresh publish dispatch.
  tag-on-version-bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Explicit token so `git push` uses GITHUB_TOKEN with the
          # workflow-level `contents: write` permission.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Cargo.toml version → tag_ref
        id: version
        run: |
          set -euo pipefail
          # `cargo pkgid` would work but pulls in the full resolver;
          # for a single-crate repo the direct grep is faster and
          # zero-dependency.
          VERSION="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          TAG_REF="v${VERSION}"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "tag_ref=${TAG_REF}"  >> "$GITHUB_OUTPUT"
          echo "Derived tag: ${TAG_REF} (from Cargo.toml version=${VERSION})"

      # Two independent signals decide the flow. The tag existing is
      # NOT enough to conclude "already shipped" — a prior run may
      # have tagged but never dispatched `publish` (e.g. because of
      # the recursion guard fixed in PR #20), leaving the tag
      # orphaned. Only "tag AND Release both exist" means the
      # release fully shipped and we can safely no-op.
      - name: Detect tag + Release existence
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ steps.version.outputs.tag_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_REF}" >/dev/null 2>&1; then
            tag_exists=true
          else
            tag_exists=false
          fi
          if gh release view "${TAG_REF}" --repo "${REPO}" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          echo "tag_exists=${tag_exists}"         >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "Detected: tag=${tag_exists}, release=${release_exists}"
          if [ "${tag_exists}" = "true" ] && [ "${release_exists}" = "true" ]; then
            echo "::notice::${TAG_REF} already shipped (tag + Release both present); nothing to do."
          elif [ "${tag_exists}" = "true" ] && [ "${release_exists}" = "false" ]; then
            echo "::notice::${TAG_REF} tag exists but has no GitHub Release yet — will dispatch publish to complete the release."
          fi

      # Create the tag only when it doesn't exist. When the tag
      # exists but the Release doesn't (partial-shipment / rerun),
      # skip this step and jump straight to the dispatch below.
      - name: Create and push release tag
        if: steps.exists.outputs.tag_exists == 'false'
        env:
          TAG_REF: ${{ steps.version.outputs.tag_ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG_REF}" -m "FileFerry ${TAG_REF}

          Auto-tagged by publish.yml on push to dev.
          See CHANGELOG.md [${VERSION}] for release notes.
          "
          git push origin "${TAG_REF}"
          echo "::notice::Pushed ${TAG_REF}."

      # GHA recursion guard: a tag push authored by GITHUB_TOKEN
      # does NOT trigger any workflow — including this one on its
      # `push: tags:` entry. Without an explicit dispatch here, the
      # tag would land but `publish` would never fire, and the
      # Releases page would stay stale. `workflow_dispatch` events
      # are the ONE exception the recursion guard allows for
      # GITHUB_TOKEN, so we use it to bridge the gap.
      #
      # Fires in TWO scenarios:
      #   1. We just created the tag (fresh release) — always dispatch.
      #   2. The tag existed but had no Release — dispatch to finish
      #      shipping a partial release from a prior failed run.
      #
      # `--ref` picks WHICH workflow-file version runs. It must point
      # at the branch tip carrying the current workflow definition
      # (i.e. this job's own ref = `dev`), NOT at the release tag —
      # the tag was cut when `Cargo.toml` said the current version,
      # so its embedded workflow file is a snapshot of whatever the
      # workflow looked like at that moment. Workflow-only fixes
      # (env-gate removals, dispatch-target changes, etc.) would be
      # invisible to a `--ref $TAG_REF` dispatch.
      #
      # `-f tag=$TAG_REF` still directs `publish`'s Checkout step to
      # the tagged commit (via the existing `inputs.tag` handling),
      # so the code that gets built is the release-cut code even
      # though the workflow file itself is the current one.
      #
      # Fires in TWO scenarios:
      #   1. We just created the tag (fresh release) — always dispatch.
      #   2. The tag existed but had no Release — dispatch to finish
      #      shipping a partial release from a prior failed run.
      - name: Dispatch publish workflow on the tag
        if: steps.exists.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ steps.version.outputs.tag_ref }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --repo "$REPO" \
            --ref  "$WORKFLOW_REF" \
            -f     tag="$TAG_REF"
          echo "::notice::Dispatched publish.yml (workflow file from ${WORKFLOW_REF}, checkout=${TAG_REF}) — run will proceed to completion (no approval prompt)."

  publish:
    # Skip on `push:dev` — that's `tag-on-version-bump`'s job.
    # Run on tag pushes (the tag `tag-on-version-bump` just
    # created, or an externally-pushed tag) and on manual
    # dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The PR review + merge into `dev` is the approval. No
    # separate `environment:` gate — the workflow-internal gates
    # (Trivy blocks on HIGH/CRITICAL, `/health` smoke test must
    # pass, cosign signing must succeed, Release-verify step
    # confirms the entry landed) are the safety net for anything
    # a PR review couldn't catch.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Derive the tag list. Two paths:
      #   * Stable release (`v0.1.0`):
      #       → push :0.1.0, :0.1, :latest
      #   * Pre-release  (`v0.1.3-alpha`, `v0.2.0-beta.1`, ...):
      #       → push :0.1.3-alpha AND :<suffix-type> (e.g. :alpha,
      #         :beta, :rc). Never move :latest or :0.1 from a pre-
      #         release — those are the implicit-trust tags.
      - name: Compose image tags
        id: meta
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            SUFFIX="${VERSION#*-}"
            SUFFIX_TYPE="${SUFFIX%%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$SUFFIX_TYPE
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$SUFFIX_TYPE
          END
          )
          else
            PRERELEASE=false
            MAJOR_MINOR="${VERSION%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$MAJOR_MINOR
          ghcr.io/turnerrainer/fileferry:latest
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$MAJOR_MINOR
          docker.io/turnerrainer/fileferry:latest
          END
          )
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"  >> "$GITHUB_OUTPUT"
          {
            echo "tags<<END_OF_TAGS"
            echo "$TAG_LINES"
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tags:"
          echo "$TAG_LINES"

      # SOURCE_DATE_EPOCH pins layer timestamps to the tag commit's
      # time. Buildx honours it with `rewrite-timestamp=true` below.
      # Bit-for-bit Rust binary reproducibility is a separate rabbit
      # hole and is NOT enforced here.
      - name: Compute SOURCE_DATE_EPOCH from commit time
        id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo secrets needed: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
      # (Read/Write/Delete scope). See DEV-REQUIREMENTS §9.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # `ignore-error=true` — cache-export failures on re-runs
          # / workflow_dispatch should not fail the publish.
          cache-to: type=gha,mode=max,ignore-error=true

      # Trivy checks OS layer + language deps. `--exit-code 1` on
      # HIGH/CRITICAL findings blocks signing. `ignore-unfixed:
      # true` because we can't patch upstream Debian CVEs.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Smoke test each per-arch image. Docker keys locally-cached
      # images by digest, not (digest, platform), so we docker rmi
      # between iterations and pull explicitly with --platform.
      - name: Smoke test — /health on both arches
        env:
          IMAGE: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke test on ${platform}"
            docker image rm -f "${IMAGE}" >/dev/null 2>&1 || true
            docker pull --quiet --platform "${platform}" "${IMAGE}"
            cid="$(docker run -d --rm --platform "${platform}" \
                   -p 18080:8080 "${IMAGE}")"

            ok=0
            for i in $(seq 1 90); do
              if curl -sf http://localhost:18080/health >/dev/null; then
                echo "${platform}: /health OK after ${i}s"
                ok=1
                break
              fi
              sleep 1
            done

            if [ "${ok}" -ne 1 ]; then
              echo "::error::${platform}: /health did not respond within 90s"
              docker logs "${cid}" || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
              exit 1
            fi

            docker rm -f "${cid}" >/dev/null
            echo "::endgroup::"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via GHA OIDC. Signs both registries so
      # `cosign verify` works wherever a partner pulls from.
      - name: Sign published images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for registry_image in \
              ghcr.io/turnerrainer/fileferry \
              docker.io/turnerrainer/fileferry
          do
            echo "Signing ${registry_image}@${DIGEST}"
            cosign sign --yes "${registry_image}@${DIGEST}"
          done

      # Extract the CHANGELOG.md slice matching the tag we're publishing
      # so the GitHub Release body reads like the release notes and not
      # like a hand-written blob that can drift from CHANGELOG.md. The
      # awk block matches `## [VERSION]` (with or without a date suffix)
      # and stops at the next `## [` heading.
      - name: Extract CHANGELOG slice for this release
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          slice="$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              # Match `## [VERSION]` at the start of the line, tolerant
              # of optional ` - YYYY-MM-DD` suffixes.
              if ($0 ~ "^## \\[" ver "\\]") {
                in_section = 1
                next
              }
            }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$slice" ]; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section — Release body will be empty"
          fi
          {
            echo "body<<END_OF_NOTES"
            printf '%s\n' "$slice"
            echo ""
            echo "---"
            echo ""
            echo "**Container images** (signed via cosign keyless, in-toto + SPDX SBOM attached):"
            echo ""
            echo "- \`ghcr.io/turnerrainer/fileferry:${VERSION}\`"
            echo "- \`docker.io/turnerrainer/fileferry:${VERSION}\`"
            echo ""
            echo "Verify: \`cosign verify ghcr.io/turnerrainer/fileferry:${VERSION} --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Create (or update) the GitHub Release entry for this tag. Runs
      # after signing so a signed image is always visible on the
      # Releases page; if signing failed the workflow aborts before
      # this step so we never publish a Release for an unverified
      # image. `prerelease` is derived from the tag (any tag with a
      # `-<suffix>` is a pre-release per `steps.meta`).
      #
      # Pin to major version `@v2` — GitHub Actions consumers should
      # prefer SHA pins for supply-chain integrity, but `softprops/
      # action-gh-release` publishes a signed release for each `vN`
      # tag and moves it atomically. Revisit if the fleet-wide
      # posture tightens to require full SHA pins.
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "FileFerry ${{ github.event.inputs.tag || github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: false

      # Belt-and-braces verification. `softprops/action-gh-release`
      # exits 0 even in some silent-failure modes (rate-limit fall-
      # through, quiet API 5xx retried and given up). Re-fetch the
      # Release via the REST API and assert it exists — turns
      # "Release probably landed" into "Release definitely landed
      # or the workflow errors loudly for the operator". Uses the
      # same GITHUB_TOKEN the create step just used, so no extra
      # secret is needed.
      - name: Verify GitHub Release landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_REF" --repo "$REPO" --json url,tagName,isPrerelease,createdAt > /tmp/release.json; then
            echo "::error::GitHub Release '$TAG_REF' did NOT appear after the create step. The image is signed and pushed, but the Releases page is stale."
            echo "::error::Re-run this workflow via workflow_dispatch to retry the Release-create step, or backfill manually with: gh release create $TAG_REF --title \"FileFerry $TAG_REF\" --prerelease --notes-file <notes>"
            exit 1
          fi
          URL="$(jq -r .url /tmp/release.json)"
          echo "::notice title=Release published::${URL}"

      # Audit trail in the Actions UI. The Summary tab shows the
      # extracted CHANGELOG slice + the Release URL post-run, so a
      # bad extraction is visible after the fact without leaving
      # the Actions page.
      - name: Emit release preview to job summary
        if: always()
        env:
          BODY: ${{ steps.notes.outputs.body }}
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release ${TAG_REF}"
            echo ""
            echo "**Releases page:** https://github.com/${REPO}/releases/tag/${TAG_REF}"
            echo ""
            echo "**Container images (signed):**"
            echo "- \`ghcr.io/turnerrainer/fileferry:${TAG_REF#v}\`"
            echo "- \`docker.io/turnerrainer/fileferry:${TAG_REF#v}\`"
            echo ""
            echo "### Release body (as extracted from CHANGELOG.md)"
            echo ""
            printf '%s\n' "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"
