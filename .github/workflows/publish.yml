name: Publish container image

# Trigger on release tag push OR manual dispatch. In both cases the
# publish job runs inside the `production` GitHub Environment, which
# is configured with required reviewers — no image is pushed to
# GHCR / Docker Hub without an explicit human approval in the
# Actions UI, even if a tag is created by accident.
#
# Alpha versioning: PATCH-as-alpha-counter with a bare `-alpha`
# suffix (0.1.1-alpha, 0.1.2-alpha, 0.1.3-alpha, ...). See
# CHANGELOG.md for the mapping from the old `-alpha.N` form.
#
# Tag-push (the normal path):
#   v0.1.0        → stable release
#   v0.1.3-alpha  → pre-release (alpha / beta / rc / preview /
#                   any SemVer pre-release identifier)
# The `derive version tags` step below reads which shape was pushed
# and chooses whether to move :latest and :major.minor accordingly.
#
# workflow_dispatch (the escape hatch):
#   Lets a maintainer re-run the publish workflow against an existing
#   tag from the Actions UI without cutting a new tag. Useful when
#   the workflow itself has a config bug. Still gated by the
#   `production` environment reviewer.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.3-alpha). Must already exist on the repo."
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers on the `production` environment enforce the
    # release policy: no deploy without a human approval in the
    # Actions UI. Configure in repo settings → Environments →
    # production → "Required reviewers". Without this environment
    # configured, the job pauses on "Waiting for review" — that's
    # the intended behaviour, not a bug.
    environment:
      name: production
      url: https://github.com/turnerrainer/fileferry/pkgs/container/fileferry
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Derive the tag list. Two paths:
      #   * Stable release (`v0.1.0`):
      #       → push :0.1.0, :0.1, :latest
      #   * Pre-release  (`v0.1.3-alpha`, `v0.2.0-beta.1`, ...):
      #       → push :0.1.3-alpha AND :<suffix-type> (e.g. :alpha,
      #         :beta, :rc). Never move :latest or :0.1 from a pre-
      #         release — those are the implicit-trust tags.
      - name: Compose image tags
        id: meta
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            SUFFIX="${VERSION#*-}"
            SUFFIX_TYPE="${SUFFIX%%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$SUFFIX_TYPE
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$SUFFIX_TYPE
          END
          )
          else
            PRERELEASE=false
            MAJOR_MINOR="${VERSION%.*}"
            TAG_LINES=$(cat <<END
          ghcr.io/turnerrainer/fileferry:$VERSION
          ghcr.io/turnerrainer/fileferry:$MAJOR_MINOR
          ghcr.io/turnerrainer/fileferry:latest
          docker.io/turnerrainer/fileferry:$VERSION
          docker.io/turnerrainer/fileferry:$MAJOR_MINOR
          docker.io/turnerrainer/fileferry:latest
          END
          )
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"  >> "$GITHUB_OUTPUT"
          {
            echo "tags<<END_OF_TAGS"
            echo "$TAG_LINES"
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tags:"
          echo "$TAG_LINES"

      # SOURCE_DATE_EPOCH pins layer timestamps to the tag commit's
      # time. Buildx honours it with `rewrite-timestamp=true` below.
      # Bit-for-bit Rust binary reproducibility is a separate rabbit
      # hole and is NOT enforced here.
      - name: Compute SOURCE_DATE_EPOCH from commit time
        id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo secrets needed: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
      # (Read/Write/Delete scope). See DEV-REQUIREMENTS §9.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # `ignore-error=true` — cache-export failures on re-runs
          # / workflow_dispatch should not fail the publish.
          cache-to: type=gha,mode=max,ignore-error=true

      # Trivy checks OS layer + language deps. `--exit-code 1` on
      # HIGH/CRITICAL findings blocks signing. `ignore-unfixed:
      # true` because we can't patch upstream Debian CVEs.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Smoke test each per-arch image. Docker keys locally-cached
      # images by digest, not (digest, platform), so we docker rmi
      # between iterations and pull explicitly with --platform.
      - name: Smoke test — /health on both arches
        env:
          IMAGE: docker.io/turnerrainer/fileferry@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke test on ${platform}"
            docker image rm -f "${IMAGE}" >/dev/null 2>&1 || true
            docker pull --quiet --platform "${platform}" "${IMAGE}"
            cid="$(docker run -d --rm --platform "${platform}" \
                   -p 18080:8080 "${IMAGE}")"

            ok=0
            for i in $(seq 1 90); do
              if curl -sf http://localhost:18080/health >/dev/null; then
                echo "${platform}: /health OK after ${i}s"
                ok=1
                break
              fi
              sleep 1
            done

            if [ "${ok}" -ne 1 ]; then
              echo "::error::${platform}: /health did not respond within 90s"
              docker logs "${cid}" || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
              exit 1
            fi

            docker rm -f "${cid}" >/dev/null
            echo "::endgroup::"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via GHA OIDC. Signs both registries so
      # `cosign verify` works wherever a partner pulls from.
      - name: Sign published images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for registry_image in \
              ghcr.io/turnerrainer/fileferry \
              docker.io/turnerrainer/fileferry
          do
            echo "Signing ${registry_image}@${DIGEST}"
            cosign sign --yes "${registry_image}@${DIGEST}"
          done
